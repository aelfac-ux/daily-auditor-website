<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Minerva-inspired thinking models used as AI long-term memory</title>
  <desc id="desc">A left-to-right flow from private inputs, to thinking models, to long-term memory, to better audit and life answers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7efe2"/>
      <stop offset="1" stop-color="#e7f2ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173c36" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="980" height="430" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" font-family="Noto Sans TC, Arial, sans-serif" font-size="28" font-weight="700" fill="#173c36">把長期記憶訓練成推理習慣庫</text>
  <text x="56" y="88" font-family="Arial, sans-serif" font-size="15" fill="#58706a">Long-term memory should remember how you think, not just what you pasted.</text>
  <g font-family="Noto Sans TC, Arial, sans-serif" filter="url(#shadow)">
    <rect x="54" y="140" width="190" height="150" rx="22" fill="#fffaf2"/>
    <text x="86" y="178" font-size="20" font-weight="700" fill="#173c36">輸入</text>
    <text x="86" y="210" font-size="15" fill="#33423f">去識別化欄位</text>
    <text x="86" y="235" font-size="15" fill="#33423f">問題情境</text>
    <text x="86" y="260" font-size="15" fill="#33423f">人工判斷限制</text>
    <rect x="286" y="140" width="220" height="150" rx="22" fill="#f6fff9"/>
    <text x="318" y="178" font-size="20" font-weight="700" fill="#173c36">思維模型</text>
    <text x="318" y="210" font-size="15" fill="#33423f">批判思考</text>
    <text x="318" y="235" font-size="15" fill="#33423f">創造思考</text>
    <text x="318" y="260" font-size="15" fill="#33423f">溝通與互動</text>
    <rect x="548" y="140" width="190" height="150" rx="22" fill="#fffaf2"/>
    <text x="580" y="178" font-size="20" font-weight="700" fill="#173c36">長期記憶</text>
    <text x="580" y="210" font-size="15" fill="#33423f">偏好格式</text>
    <text x="580" y="235" font-size="15" fill="#33423f">查核口吻</text>
    <text x="580" y="260" font-size="15" fill="#33423f">常用檢核問題</text>
    <rect x="780" y="140" width="150" height="150" rx="22" fill="#173c36"/>
    <text x="816" y="178" font-size="20" font-weight="700" fill="#ffffff">回答</text>
    <text x="814" y="210" font-size="15" fill="#d9efe6">更穩健</text>
    <text x="814" y="235" font-size="15" fill="#d9efe6">更保密</text>
    <text x="814" y="260" font-size="15" fill="#d9efe6">更像自己</text>
  </g>
  <g stroke="#b58438" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 215h28"/>
    <path d="M272 205l10 10-10 10"/>
    <path d="M512 215h28"/>
    <path d="M534 205l10 10-10 10"/>
    <path d="M744 215h28"/>
    <path d="M766 205l10 10-10 10"/>
  </g>
  <g font-family="Noto Sans TC, Arial, sans-serif">
    <rect x="92" y="330" width="796" height="48" rx="24" fill="#ffffff" opacity=".75"/>
    <text x="130" y="361" font-size="17" font-weight="700" fill="#173c36">核心規則：</text>
    <text x="214" y="361" font-size="17" fill="#33423f">機密資料不進公有工具；記憶只保存思考框架、偏好格式與去識別化範例。</text>
  </g>
</svg>
