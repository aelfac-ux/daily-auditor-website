<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">從資料分析走向 AI 輔助稽核的四層查核陣法</title><desc id="desc">資料分析檢查結構化交易，AI 整理文件與語意線索，自動化串接來源，最後由稽核人員驗證證據。</desc>
<rect width="1200" height="680" fill="#f7f3e8"/><text x="70" y="72" fill="#173c36" font-family="sans-serif" font-size="34" font-weight="700">資料分析是起點，不是終點</text><text x="70" y="108" fill="#66736f" font-family="sans-serif" font-size="17">四層查核陣法：數字、脈絡、自動化與人的專業判斷</text>
<g font-family="sans-serif"><rect x="80" y="160" width="240" height="350" rx="20" fill="#173c36"/><text x="200" y="213" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">第一層｜外家功夫</text><text x="200" y="254" text-anchor="middle" fill="white" font-size="24" font-weight="700">資料分析</text><text x="115" y="310" fill="#c6d8d0" font-size="16">✓ 金額與日期</text><text x="115" y="346" fill="#c6d8d0" font-size="16">✓ 三方比對</text><text x="115" y="382" fill="#c6d8d0" font-size="16">✓ 權限與重複</text><text x="115" y="442" fill="#ef9e77" font-size="15">看見規則異常</text>
<rect x="350" y="160" width="240" height="350" rx="20" fill="#244d46"/><text x="470" y="213" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">第二層｜語意線索</text><text x="470" y="254" text-anchor="middle" fill="white" font-size="24" font-weight="700">AI 輔助研判</text><text x="385" y="310" fill="#c6d8d0" font-size="16">✓ 合約條款</text><text x="385" y="346" fill="#c6d8d0" font-size="16">✓ 信件與新聞</text><text x="385" y="382" fill="#c6d8d0" font-size="16">✓ 變更紀錄脈絡</text><text x="385" y="442" fill="#ef9e77" font-size="15">整理疑點，不下定論</text>
<rect x="620" y="160" width="240" height="350" rx="20" fill="#df714c"/><text x="740" y="213" text-anchor="middle" fill="#fff3e9" font-size="15" font-weight="700">第三層｜機關傀儡</text><text x="740" y="254" text-anchor="middle" fill="white" font-size="24" font-weight="700">RPA 與管線</text><text x="655" y="310" fill="#fff3e9" font-size="16">✓ 定時擷取</text><text x="655" y="346" fill="#fff3e9" font-size="16">✓ 跨系統串接</text><text x="655" y="382" fill="#fff3e9" font-size="16">✓ 留存執行紀錄</text><text x="655" y="442" fill="white" font-size="15">把情報送到正確位置</text>
<rect x="890" y="160" width="240" height="350" rx="20" fill="#102d28"/><text x="1010" y="213" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">第四層｜最後裁決</text><text x="1010" y="254" text-anchor="middle" fill="white" font-size="24" font-weight="700">人工驗證</text><text x="925" y="310" fill="#c6d8d0" font-size="16">✓ 追查原始證據</text><text x="925" y="346" fill="#c6d8d0" font-size="16">✓ 訪談與反證</text><text x="925" y="382" fill="#c6d8d0" font-size="16">✓ 形成稽核結論</text><text x="925" y="442" fill="#ef9e77" font-size="15">人對判斷負責</text></g>
<path d="M320 335h28M590 335h28M860 335h28" stroke="#df714c" stroke-width="5"/><path d="M338 325l14 10-14 10M608 325l14 10-14 10M878 325l14 10-14 10" fill="none" stroke="#df714c" stroke-width="4"/>
<rect x="210" y="555" width="780" height="64" rx="32" fill="#e7f0e9"/><text x="600" y="595" text-anchor="middle" fill="#173c36" font-family="sans-serif" font-size="20" font-weight="700">AI 可以擴大視野；證據、治理與專業懷疑決定能否結案</text>
</svg>
