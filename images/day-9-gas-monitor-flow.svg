<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Google Apps Script 重大訊息監控流程</title><desc id="desc">從清楚描述需求、讀取證交所 OpenAPI、篩選公司代號、排除已寄送公告到寄出電子郵件的五步流程。</desc><rect width="1200" height="680" fill="#f7f3e8"/><text x="70" y="76" fill="#173c36" font-family="sans-serif" font-size="34" font-weight="700">實作入門 01｜把公開資訊變成自己的瞭望台</text><text x="70" y="112" fill="#66736f" font-family="sans-serif" font-size="16">Practical Starter 01 · From public data to a personal watchtower</text>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(145 330)"><circle r="86" fill="#173c36"/><text y="-20" fill="#ef9e77" font-size="15" font-weight="700">01 · PROMPT</text><text y="15" fill="white" font-size="21" font-weight="700">說清楚需求</text><text y="45" fill="#c6d8d0" font-size="13">Define the task</text></g><g transform="translate(370 330)"><circle r="86" fill="#244d46"/><text y="-20" fill="#ef9e77" font-size="15" font-weight="700">02 · FETCH</text><text y="15" fill="white" font-size="21" font-weight="700">TWSE OpenAPI</text><text y="45" fill="#c6d8d0" font-size="13">Fetch public data</text></g><g transform="translate(600 330)"><circle r="86" fill="#df714c"/><text y="-20" fill="#fff3e9" font-size="15" font-weight="700">03 · FILTER</text><text y="15" fill="white" font-size="21" font-weight="700">篩選 2330</text><text y="45" fill="#fff3e9" font-size="13">Select the company</text></g><g transform="translate(830 330)"><circle r="86" fill="#244d46"/><text y="-20" fill="#ef9e77" font-size="15" font-weight="700">04 · DEDUPE</text><text y="15" fill="white" font-size="21" font-weight="700">排除已寄公告</text><text y="45" fill="#c6d8d0" font-size="13">Avoid duplicates</text></g><g transform="translate(1055 330)"><circle r="86" fill="#173c36"/><text y="-20" fill="#ef9e77" font-size="15" font-weight="700">05 · ALERT</text><text y="15" fill="white" font-size="21" font-weight="700">寄出 Email</text><text y="45" fill="#c6d8d0" font-size="13">Send notification</text></g></g>
<path d="M231 330h50M456 330h55M686 330h55M916 330h50" stroke="#df714c" stroke-width="5"/><path d="M271 320l14 10-14 10M501 320l14 10-14 10M731 320l14 10-14 10M956 320l14 10-14 10" fill="none" stroke="#df714c" stroke-width="4"/><rect x="220" y="520" width="760" height="68" rx="34" fill="#e7f0e9"/><text x="600" y="550" text-anchor="middle" fill="#173c36" font-family="sans-serif" font-size="18" font-weight="700">船長守則：公開資料也要檢查來源、頻率、授權與錯誤</text><text x="600" y="575" text-anchor="middle" fill="#66736f" font-family="sans-serif" font-size="14">Public data still needs source, frequency, permission, and error controls</text></svg>
