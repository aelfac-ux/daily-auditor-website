<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Apps Script 每日自動執行流程</title><desc id="desc">先手動測試與授權，建立早上七點到八點的時間驅動觸發器，Apps Script 取得公開資訊、排除重複公告、寄信並留下執行紀錄。</desc><rect width="1200" height="680" fill="#f7f3e8"/><text x="70" y="72" fill="#173c36" font-family="sans-serif" font-size="34" font-weight="700">實作入門 02｜讓瞭望台每天自動啟航</text><text x="70" y="108" fill="#66736f" font-family="sans-serif" font-size="16">Practical Starter 02 · Schedule, execute, verify, and recover</text>
<g font-family="sans-serif"><rect x="75" y="165" width="300" height="155" rx="18" fill="#173c36"/><text x="225" y="210" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">出航前｜BEFORE SAILING</text><text x="225" y="250" text-anchor="middle" fill="white" font-size="23" font-weight="700">手動測試＋完成授權</text><text x="225" y="283" text-anchor="middle" fill="#c6d8d0" font-size="14">Manual test and authorization</text>
<rect x="450" y="165" width="300" height="155" rx="18" fill="#df714c"/><text x="600" y="210" text-anchor="middle" fill="#fff3e9" font-size="15" font-weight="700">鬧鐘｜TIME TRIGGER</text><text x="600" y="250" text-anchor="middle" fill="white" font-size="23" font-weight="700">每天 7–8 點自動喚醒</text><text x="600" y="283" text-anchor="middle" fill="#fff3e9" font-size="14">Runs once within the selected hour</text>
<rect x="825" y="165" width="300" height="155" rx="18" fill="#244d46"/><text x="975" y="210" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">巡航｜DAILY WATCH</text><text x="975" y="250" text-anchor="middle" fill="white" font-size="23" font-weight="700">讀取、去重、寄信</text><text x="975" y="283" text-anchor="middle" fill="#c6d8d0" font-size="14">Fetch, deduplicate, and notify</text>
<rect x="260" y="410" width="300" height="150" rx="18" fill="#244d46"/><text x="410" y="455" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">航海日誌｜EXECUTIONS</text><text x="410" y="495" text-anchor="middle" fill="white" font-size="23" font-weight="700">查看成功與錯誤紀錄</text><text x="410" y="526" text-anchor="middle" fill="#c6d8d0" font-size="14">Review run history and failures</text>
<rect x="640" y="410" width="300" height="150" rx="18" fill="#102d28"/><text x="790" y="455" text-anchor="middle" fill="#ef9e77" font-size="15" font-weight="700">船長覆核｜HUMAN CHECK</text><text x="790" y="495" text-anchor="middle" fill="white" font-size="23" font-weight="700">確認通知仍然可靠</text><text x="790" y="526" text-anchor="middle" fill="#c6d8d0" font-size="14">Confirm the watcher still works</text></g>
